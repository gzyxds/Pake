name: 使用 Pake CLI 构建应用

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "网站地址"
        required: true
      name:
        description: "应用名称（Linux 下使用小写）"
        required: true
      icon:
        description: "图标地址（留空则自动获取）"
        required: false
      width:
        description: "窗口宽度（像素）"
        required: false
        default: "1200"
      height:
        description: "窗口高度（像素）"
        required: false
        default: "780"
      min_width:
        description: "最小窗口宽度（像素）"
        required: false
      min_height:
        description: "最小窗口高度（像素）"
        required: false
      app_version:
        description: "应用版本"
        required: false
        default: "1.0.0"
      installer_language:
        description: "Windows 安装包语言（仅 Windows 生效）"
        required: false
        type: choice
        default: "zh-CN"
        options:
          - "zh-CN"
          - "en-US"
      fullscreen:
        description: "启动时进入全屏模式"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "隐藏标题栏（仅 macOS）"
        required: false
        type: boolean
        default: false
      new_window:
        description: "允许网站打开新窗口"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "通用二进制（仅 macOS）"
        required: false
        type: boolean
        default: false
      targets:
        description: "Linux 安装包格式（仅 Linux 生效，用逗号分隔：deb、appimage、rpm、zst）"
        required: false
        default: "deb"

# Builds an app on demand for anyone who runs it; it writes nothing.
permissions:
  contents: read

jobs:
  build:
    name: 构建平台：${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 配置 Node.js 环境
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: 构建 CLI
        run: pnpm run cli:build

      - name: 配置 mold 链接器
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: 构建应用（Linux/macOS）
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_INSTALLER_LANGUAGE: ${{ inputs.installer_language }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME")

          if [ -n "$INPUT_ICON" ]; then
            ARGS+=("--icon" "$INPUT_ICON")
          fi

          if [ -n "$INPUT_WIDTH" ]; then
            ARGS+=("--width" "$INPUT_WIDTH")
          fi

          if [ -n "$INPUT_HEIGHT" ]; then
            ARGS+=("--height" "$INPUT_HEIGHT")
          fi

          if [ -n "$INPUT_MIN_WIDTH" ]; then
            ARGS+=("--min-width" "$INPUT_MIN_WIDTH")
          fi

          if [ -n "$INPUT_MIN_HEIGHT" ]; then
            ARGS+=("--min-height" "$INPUT_MIN_HEIGHT")
          fi

          if [ -n "$INPUT_APP_VERSION" ]; then
            ARGS+=("--app-version" "$INPUT_APP_VERSION")
          fi

          if [ "$INPUT_FULLSCREEN" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "$INPUT_HIDE_TITLE_BAR" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "$INPUT_NEW_WINDOW" == "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "$INPUT_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "$INPUT_TARGETS" ] && [ "$RUNNER_OS" == "Linux" ]; then
            ARGS+=("--targets" "$INPUT_TARGETS")
          fi

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          node dist/cli.js "${ARGS[@]}"

      - name: 构建应用（Windows）
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          $args = $env:INPUT_URL, "--name", $env:INPUT_NAME

          # Empty environment variables are unset on Windows, so test for null too.
          if (-not [string]::IsNullOrEmpty($env:INPUT_ICON)) {
            $args += "--icon", $env:INPUT_ICON
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_WIDTH)) {
            $args += "--width", $env:INPUT_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_HEIGHT)) {
            $args += "--height", $env:INPUT_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_WIDTH)) {
            $args += "--min-width", $env:INPUT_MIN_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_HEIGHT)) {
            $args += "--min-height", $env:INPUT_MIN_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_APP_VERSION)) {
            $args += "--app-version", $env:INPUT_APP_VERSION
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_INSTALLER_LANGUAGE)) {
            $args += "--installer-language", $env:INPUT_INSTALLER_LANGUAGE
          }

          if ($env:INPUT_FULLSCREEN -eq "true") {
            $args += "--fullscreen"
          }

          if ($env:INPUT_HIDE_TITLE_BAR -eq "true") {
            $args += "--hide-title-bar"
          }

          if ($env:INPUT_NEW_WINDOW -eq "true") {
            $args += "--new-window"
          }

          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          node dist/cli.js $args
          $buildExitCode = $LASTEXITCODE

          git checkout -- src-tauri/Cargo.lock
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: 上传 DMG（macOS）
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      # The CLI lowercases and hyphenates Linux names, so match packages by extension.
      - name: 上传 DEB（Linux）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: "*.deb"
          retention-days: 3
          if-no-files-found: ignore

      - name: 上传 AppImage（Linux）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: "*.AppImage"
          retention-days: 3
          if-no-files-found: ignore

      - name: 上传 RPM（Linux）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: "*.rpm"
          retention-days: 3
          if-no-files-found: ignore

      - name: 上传 ZST（Linux）
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: "*.pkg.tar.zst"
          retention-days: 3
          if-no-files-found: ignore

      - name: 上传 MSI（Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          retention-days: 3
          if-no-files-found: error
